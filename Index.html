<script>
// ── PWA Setup ──
const MANIFEST = {
  name: "QR Code Generator",
  short_name: "QR Gen",
  description: "QR Code Generator with Arabic support, Logo, Certified scanning",
  start_url: "./",
  display: "standalone",
  background_color: "#ffffff",
  theme_color: "#7c3aed",
  orientation: "portrait",
  icons: [
    { src: "https://via.placeholder.com/192x192/7c3aed/ffffff?text=QR", sizes: "192x192", type: "image/png" },
    { src: "https://via.placeholder.com/512x512/7c3aed/ffffff?text=QR", sizes: "512x512", type: "image/png" }
  ]
};

// Inject manifest
const mBlob = new Blob([JSON.stringify(MANIFEST)], {type:'application/json'});
const mUrl = URL.createObjectURL(mBlob);
const mLink = document.createElement('link');
mLink.rel = 'manifest'; mLink.href = mUrl;
document.head.appendChild(mLink);

// Service Worker via blob
const swCode = `
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => new Response('Offline'))); });
`;
if ('serviceWorker' in navigator) {
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-bar').classList.add('show');
});
function installPWA() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.waitForOutcome().then(()=>{ deferredPrompt=null; document.getElementById('install-bar').classList.remove('show'); }); }
}

// ── App State ──
const CERT_ID = 'QR-' + Math.random().toString(36).substring(2,9).toUpperCase();
const ISSUED = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
let currentTab = 'url';
let logoData = null;
let currentQRCanvas = null;
let currentData = '';
let scanning = false;
let camStream = null;
let rafId = null;

const isArabic = t => /[\u0600-\u06FF]/.test(t);
const toUTF8 = s => { try { return unescape(encodeURIComponent(s)); } catch { return s; } };
const buildPayload = d => toUTF8(d + '\n— CERT: ' + CERT_ID);

// ── Tabs ──
function switchTab(tab) {
  ['url','text','contact','scan'].forEach(t => {
    document.getElementById('pane-'+t).classList.toggle('hidden', t !== tab);
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);
  });
  currentTab = tab;
  if (tab !== 'scan') stopScan();
}

// ── QR Generation ──
function getData() {
  if (currentTab === 'url') {
    let u = document.getElementById('url-input').value.trim();
    if (!u) return '';
    return (!u.startsWith('http://') && !u.startsWith('https://')) ? 'https://'+u : u;
  }
  if (currentTab === 'text') return document.getElementById('text-input').value.trim();
  if (currentTab === 'contact') {
    const f = v => document.getElementById(v).value.trim();
    if (!f('c-first') && !f('c-last') && !f('c-phone') && !f('c-email')) return '';
    return `BEGIN:VCARD\nVERSION:3.0\nFN:${f('c-first')} ${f('c-last')}\nN:${f('c-last')};${f('c-first')};;;\nORG:${f('c-org')}\nTEL:${f('c-phone')}\nEMAIL:${f('c-email')}\nURL:${f('c-url')}\nEND:VCARD`;
  }
  return '';
}

function loadQRious(cb) {
  if (window.QRious) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js';
  s.onload = cb; document.head.appendChild(s);
}

function generate() {
  const data = getData();
  currentData = data;
  const outId = 'qr-out-' + currentTab;
  const out = document.getElementById(outId);
  if (!out) return;
  if (!data) { out.innerHTML = ''; currentQRCanvas = null; return; }

  loadQRious(() => {
    out.innerHTML = '';
    const tmpl = document.getElementById('qr-template').content.cloneNode(true);
    out.appendChild(tmpl);
    const display = out.querySelector('#qr-display');
    const canvas = document.createElement('canvas');
    display.appendChild(canvas);
    canvas.style.cssText = 'max-width:100%;height:auto;border-radius:10px;display:block';
    new window.QRious({ element: canvas, value: buildPayload(data), size: 300, background: 'white', foreground: '#1e1e2e', level: logoData ? 'H' : 'L' });
    currentQRCanvas = canvas;
    if (logoData) overlayLogo(canvas, logoData);
  });
}

function overlayLogo(canvas, src) {
  const img = new Image();
  img.onload = () => {
    const ctx = canvas.getContext('2d');
    const s = canvas.width * 0.22, x = (canvas.width-s)/2, y = (canvas.height-s)/2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, s/2+8, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, s/2, 0, Math.PI*2); ctx.clip(); ctx.drawImage(img, x, y, s, s); ctx.restore();
  };
  img.src = src;
}

function handleLogo(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    logoData = e.target.result;
    document.getElementById('logo-area').innerHTML = `<div class="logo-preview"><img src="${logoData}" style="width:36px;height:36px;border-radius:6px;object-fit:cover"/><span style="flex:1;font-size:13px;color:#7c3aed;font-weight:600">${file.name}</span><button onclick="removeLogo()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px">✕</button></div>`;
    generate();
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  logoData = null;
  document.getElementById('logo-area').innerHTML = '<button class="upload-btn" onclick="document.getElementById(\'logo-input\').click()">⬆ Upload Logo / شعار</button>';
  document.getElementById('logo-input').value = '';
  generate();
}

function clearAll() {
  ['url-input','text-input','c-first','c-last','c-phone','c-email','c-org','c-url'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  removeLogo();
  ['qr-out-url','qr-out-text','qr-out-contact'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML=''; });
  currentQRCanvas = null; currentData = '';
}

// ── Auto-dir for inputs ──
document.querySelectorAll('input,textarea').forEach(el => {
  el.addEventListener('input', function() {
    this.style.direction = isArabic(this.value) ? 'rtl' : 'ltr';
    this.style.textAlign = isArabic(this.value) ? 'right' : 'left';
  });
});

// ── Download ──
function downloadQR() {
  if (!currentQRCanvas) return;
  const dataUrl = currentQRCanvas.toDataURL('image/png');
  document.getElementById('save-cert-label').textContent = '✅ CERTIFIED · ' + CERT_ID;
  document.getElementById('save-date').textContent = ISSUED;
  document.getElementById('save-img').src = dataUrl;
  document.getElementById('save-screen').classList.remove('hidden');
}

function copyData() {
  if (!currentData) return;
  navigator.clipboard.writeText(buildPayload(currentData)).then(() => {
    const btn = document.getElementById('copy-btn');
    if(btn){btn.textContent='✅ Copied!'; setTimeout(()=>btn.textContent='📋 Copy',2000);}
  });
}

// ── Cert Preview ──
function showCertPreview() {
  const details = document.getElementById('cert-details');
  details.innerHTML = [['Cert ID',CERT_ID],['Issued',ISSUED],['Status','Verified'],['Issuer','QR Code Generator']].map(([k,v]) =>
    `<div class="detail-row"><span class="text-gray text-sm">${k}</span><span class="text-green font-bold text-sm">${v}</span></div>`
  ).join('');
  renderDocCard(document.getElementById('cert-doc-area'), currentData);
  document.getElementById('cert-modal').classList.remove('hidden');
}

function renderDocCard(container, data) {
  const lines = data.split('\n').filter(Boolean).map(l =>
    `<div class="doc-line" style="direction:${isArabic(l)?'rtl':'ltr'};text-align:${isArabic(l)?'right':'left'}">${l}</div>`
  ).join('');
  container.innerHTML = `<div class="doc-card">
    <div class="doc-header">
      <span style="color:white;font-weight:700;font-size:13px">📄 Official Document</span>
      <span style="background:#bbf7d0;color:#15803d;font-size:10px;font-weight:700;border-radius:20px;padding:2px 10px">VERIFIED</span>
    </div>
    <div class="doc-content"><div class="doc-watermark">CERTIFIED</div><div style="position:relative">${lines}</div></div>
    <div class="doc-footer"><span style="color:#9ca3af">ID: ${CERT_ID}</span><span style="color:#15803d;font-weight:700">🛡 Digitally Certified</span></div>
  </div>`;
}

// ── Scanner ──
function loadJsQR() {
  return new Promise(res => {
    if (window.jsQR) { res(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js';
    s.onload = res; s.onerror = res;
    document.head.appendChild(s);
  });
}

async function startScan() {
  document.getElementById('scan-error').classList.add('hidden');
  document.getElementById('scan-result-area').innerHTML = '';
  document.getElementById('cam-placeholder').style.display = 'none';
  document.getElementById('scan-btn').textContent = '⏳ Starting…';
  document.getElementById('scan-btn').disabled = true;

  await Promise.all([
    loadJsQR(),
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 480 }, height: { ideal: 480 } }, audio: false
    }).then(stream => {
      camStream = stream;
      const video = document.getElementById('cam-video');
      video.srcObject = stream; video.muted = true; video.playsInline = true;
      const go = () => { video.play().catch(()=>{}); document.getElementById('scan-ui').style.display = 'flex'; scanning = true; tick(); };
      video.addEventListener('canplay', go, {once:true});
      video.addEventListener('loadeddata', go, {once:true});
      video.load();
      setTimeout(go, 1500);
    }).catch(() => {
      const err = document.getElementById('scan-error');
      err.textContent = 'Camera access denied. Please allow camera permission.';
      err.classList.remove('hidden');
    })
  ]);

  document.getElementById('scan-btn').textContent = '⏹ Stop Scanning';
  document.getElementById('scan-btn').disabled = false;
  document.getElementById('scan-btn').onclick = stopScan;
  document.getElementById('scan-btn').className = 'btn btn-red';
}

function stopScan() {
  scanning = false;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  const video = document.getElementById('cam-video');
  video.srcObject = null;
  document.getElementById('scan-ui').style.display = 'none';
  document.getElementById('cam-placeholder').style.display = 'flex';
  const btn = document.getElementById('scan-btn');
  btn.textContent = '📷 Start Scanning'; btn.onclick = startScan; btn.className = 'btn btn-primary'; btn.disabled = false;
}

function tick() {
  if (!scanning) return;
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('scan-canvas');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (window.jsQR) {
      const code = window.jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
      if (code) {
        let decoded = code.data;
        try { decoded = decodeURIComponent(escape(code.data)); } catch {}
        stopScan();
        showScanResult(decoded);
        return;
      }
    }
  }
  rafId = requestAnimationFrame(tick);
}

function showScanResult(text) {
  const area = document.getElementById('scan-result-area');
  const isCert = text.includes('— CERT:');
  const certId = (text.match(/— CERT: ([A-Z0-9-]+)/) || [])[1] || CERT_ID;
  const cleanText = text.replace(/\n?— CERT:.*$/,'');

  if (isCert) {
    const lines = cleanText.split('\n').filter(Boolean).map(l =>
      `<div class="doc-line" style="direction:${isArabic(l)?'rtl':'ltr'};text-align:${isArabic(l)?'right':'left'}">${l}</div>`
    ).join('');
    area.innerHTML = `<div class="result-card">
      <div class="result-header">
        <div class="check-circle"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <p style="color:white;font-weight:800;font-size:20px;letter-spacing:3px;margin:0">CERTIFIED</p>
        <p style="color:#bbf7d0;font-size:12px;margin:4px 0 0">Verified & Authentic Document</p>
      </div>
      <div class="result-body">
        ${[['Cert ID',certId],['Issued',ISSUED],['Status','Verified'],['Issuer','QR Code Generator']].map(([k,v])=>`<div class="detail-row"><span class="text-gray text-sm">${k}</span><span class="text-green font-bold text-sm">${v}</span></div>`).join('')}
        <div class="doc-card mt-3">
          <div class="doc-header">
            <span style="color:white;font-weight:700;font-size:13px">📄 Official Document</span>
            <span style="background:#bbf7d0;color:#15803d;font-size:10px;font-weight:700;border-radius:20px;padding:2px 10px">VERIFIED</span>
          </div>
          <div class="doc-content"><div class="doc-watermark">CERTIFIED</div><div style="position:relative">${lines}</div></div>
          <div class="doc-footer"><span style="color:#9ca3af">ID: ${certId}</span><span style="color:#15803d;font-weight:700">🛡 Digitally Certified</span></div>
        </div>
      </div>
    </div>
    <button class="btn btn-secondary mt-3" onclick="document.getElementById('scan-result-area').innerHTML='';document.getElementById('scan-btn').style.display='block'">Scan Another</button>`;
  } else {
    area.innerHTML = `<div class="card" style="overflow:hidden">
      <div style="background:#7c3aed;padding:12px 16px;display:flex;align-items:center;gap:8px">
        <span style="color:white;font-size:18px">✅</span>
        <span style="color:white;font-weight:700;font-size:14px">QR Scanned Successfully</span>
      </div>
      <div style="padding:14px 16px">
        <p class="text-sm text-gray font-bold mb-2">Content:</p>
        <div style="background:#f8fafc;border-radius:10px;padding:10px 12px;direction:${isArabic(text)?'rtl':'ltr'};text-align:${isArabic(text)?'right':'left'};font-size:13px;color:#1f2937;line-height:1.6;word-break:break-word;max-height:160px;overflow-y:auto;font-family:Segoe UI,Tahoma,Arial,sans-serif">${text}</div>
      </div>
    </div>
    <button class="btn btn-secondary mt-3" onclick="document.getElementById('scan-result-area').innerHTML=''">Scan Another</button>`;
  }
}
</script>
</body>
</html>
